AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CICD Seminar - Full infra: VPC, subnets, NAT, RDS, ECS cluster, ALB (Blue/Green TG),
  ECR repos, IAM roles, S3 artifact bucket, CloudWatch logs.
Parameters:
  UserNameDate:
    Type: String
    Description: "yoshiike-0330"

Resources:
  ###################
  # VPC & Subnets
  ###################
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub vpc-${UserNameDate}

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub public-subnet-a-${UserNameDate}

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub public-subnet-c-${UserNameDate}

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub private-a-subnet-${UserNameDate}

  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub private-c-subnet-${UserNameDate}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub igw-${UserNameDate}

  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{ Key: Name, Value: !Sub "nat-${UserNameDate}" }]

  ###################
  # Route Tables
  ###################
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub public-rt-${UserNameDate}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetCRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetC
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub private-rt-${UserNameDate}      

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetCRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetC
      RouteTableId: !Ref PrivateRouteTable

  ###################
  # Security Groups
  ###################
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub "alb-sg-${UserNameDate}" }]

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks (allow from ALB)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags: [{ Key: Name, Value: !Sub "ecs-sg-${UserNameDate}" }]

  PhpMyAdminSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: phpMyAdmin public access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub "pma-sg-${UserNameDate}" }]

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ECSSecurityGroup
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref PhpMyAdminSG
      Tags: [{ Key: Name, Value: !Sub "rds-sg-${UserNameDate}" }]

  ###################
  # RDS
  ###################
  MyRDSParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: mariadb10.11
      Description: "Seminar settings to avoid SSL and Blocked host issues"
      Parameters:
        require_secure_transport: "OFF" # SSLエラーを回避
        max_connect_errors: "10000"     # ホストブロックを回避

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "RDS private subnets"   
      SubnetIds: [ !Ref PrivateSubnetA, !Ref PrivateSubnetC ]
      Tags: [{ Key: Name, Value: !Sub "db-subnetgroup-${UserNameDate}" }]

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "db-${UserNameDate}"
      DBName: "seminar_db"
      Engine: mariadb
      EngineVersion: "10.11.14"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: root
      MasterUserPassword: root1234
      VPCSecurityGroups: [ !Ref RDSSecurityGroup ]
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBParameterGroupName: !Ref MyRDSParameterGroup
      BackupRetentionPeriod: 1
      PubliclyAccessible: false
      MultiAZ: false
      Tags: [{ Key: Name, Value: !Sub "rds-${UserNameDate}" }]

  ###################
  # CloudWatch Logs
  ###################
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/task-${UserNameDate}"
      RetentionInDays: 7

  ###################
  # ECS Cluster
  ###################
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ecs-cluster-${UserNameDate}

  ###################
  # ALB & TGs & Listeners
  ###################  
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "alb-${UserNameDate}"
      Scheme: internet-facing
      Subnets: [ !Ref PublicSubnetA, !Ref PublicSubnetC ]
      SecurityGroups: [ !Ref ALBSecurityGroup ]
      Tags: [{ Key: Name, Value: !Sub "alb-${UserNameDate}" }]

  JavaTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "java-tg-${UserNameDate}"
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /
      Tags: [{ Key: Name, Value: !Sub "java-tg-${UserNameDate}" }]

  # Listener
  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - JavaTG
      - ALB
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref JavaTG


  ###################
  # IAM Roles
  ###################
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "TaskExecutionRole-${UserNameDate}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: [ ecs-tasks.amazonaws.com ] }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ###################
  # ECS Task Definitions (initial templates)
  ###################
  TaskDefPhpMyAdmin:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "task-phpmyadmin-${UserNameDate}"
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      RequiresCompatibilities: [ FARGATE ]
      Cpu: "256"
      Memory: "512"
      ContainerDefinitions:
        - Name: phpmyadmin
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ecr-phpmyadmin-${UserNameDate}:5.2.1"
          Memory: 512
          Cpu: 256
          Essential: true
          PortMappings: [ { ContainerPort: 80, Protocol: tcp } ]
          Environment:
            - Name: PMA_HOST
              Value: !GetAtt RDSInstance.Endpoint.Address
            - Name: PMA_USER
              Value: root
            - Name: PMA_PASSWORD
              Value: root1234
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: phpmyadmin

  ###################
  # ECS Services
  # - java service: CODE_DEPLOY (Blue/Green) + attached to JavaTG initially
  # - phpmyadmin service: public Fargate in public subnets (AssignPublicIp ENABLED)
  ###################
  PhpMyAdminService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "phpmyadmin-service-${UserNameDate}"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefPhpMyAdmin
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PublicSubnetA
          SecurityGroups:
            - !Ref PhpMyAdminSG
          AssignPublicIp: ENABLED

Outputs:
  RdsEndpoint:
    Description: RDS Endpoint Address (used for DB_HOST)
    Value: !GetAtt RDSInstance.Endpoint.Address
  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster
  ALBArn:
    Description: ALB Arn
    Value: !Ref ALB
  ALBDNS:
    Description: ALB DNS name
    Value: !GetAtt ALB.DNSName
  JavaTGArn:
    Description: Java TG ARN
    Value: !Ref JavaTG
  TaskExecutionRoleArn:
    Description: ECS TaskExecution role ARN
    Value: !GetAtt TaskExecutionRole.Arn
  JavaServiceName:
    Description: java ECS service name
    Value: !Sub "java-service-${UserNameDate}"
  PhpMyAdminServiceName:
    Description: phpmyadmin ECS service name
    Value: !Sub "phpmyadmin-service-${UserNameDate}"
  AlbHttpListenerArn:
    Description: "HTTP listener ARN (port 80)"
    Value: !Ref ALBListenerHTTP